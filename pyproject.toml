[project]
name = "gpt-computer"
version = "0.1.1"
description = "Specify what you want it to build, the AI asks for clarification, and then builds it."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {text = "MIT"}
authors = [
  {name = "Md Sulaiman", email = "infosulaimanbd@gmail.com"}
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "openai>=1.99.5",
  "termcolor==2.3.0",
  "typer>=0.3.2",
  "rudder-sdk-python>=2.0.2",
  "dataclasses-json==0.5.7",
  "tiktoken==0.8.0",
  "tabulate==0.9.0",
  "python-dotenv>=1.1.0",
  "langchain>=0.1.2",
  "langchain-openai",
  "toml>=0.10.2",
  "tomlkit>=0.12.4",
  "pyperclip>=1.8.2",
  "langchain-anthropic>=0.1.1",
  "regex>=2023.12.25",
  "pillow>=10.2.0",
  "datasets>=2.17.1",
  "black==23.3.0",
  "langchain-community>=0.3.19",
  "langchain-google-genai>=1.0.1",
  "langchain-groq>=0.1.0",
  "langchain-mistralai>=0.1.0",
  "langchain-cohere>=0.1.4",
  "pyyaml>=6.0.1",
  "gitpython>=3.1.43",
  "packaging>=23.2",
  "setuptools",
  "a2wsgi==1.10.8",
  "ansio==0.0.1",
  "browser-use",
  "docker==7.1.0",
  "duckduckgo-search==6.1.12",
  "faiss-cpu==1.11.0",
  "fastmcp==2.13.1",
  "fasta2a==0.5.0",
  "flask[async]==3.0.3",
  "flask-basicauth==0.2.0",
  "flaredantic==0.1.5",
  "inputimeout==1.0.4",
  "kokoro>=0.9.2",
  "simpleeval==1.0.3",
  "langchain-core>=0.3.49",
  "langchain-unstructured[all-docs]==0.1.6",
  "openai-whisper",
  "lxml_html_clean==0.3.1",
  "markdown==3.7",
  "mcp==1.22.0",
  "newspaper3k==0.2.8",
  "paramiko==3.5.0",
  "playwright==1.52.0",
  "pypdf==6.0.0",
  "pytz==2024.2",
  "sentence-transformers==3.0.1",
  "unstructured[all-docs]==0.16.23",
  "unstructured-client==0.31.0",
  "webcolors==24.6.0",
  "nest-asyncio==1.6.0",
  "crontab==1.0.1",
  "markdownify==1.1.0",
  "pydantic==2.11.7",
  "pymupdf==1.25.3",
  "pytesseract==0.3.13",
  "pdf2image==1.17.0",
  "pathspec>=0.12.1",
  "psutil>=7.0.0",
  "soundfile==0.13.1",
  "imapclient>=3.0.1",
  "html2text>=2024.2.26",
  "beautifulsoup4>=4.12.3",
  "boto3>=1.35.0",
  "exchangelib>=5.4.3",
  "pywinpty==3.0.2; sys_platform == 'win32'",
  "python-socketio>=5.14.2",
  "uvicorn>=0.38.0",
  "wsproto>=1.2.0",
  "litellm>=1.79.3",
]

[project.urls]
homepage = "https://github.com/xeondesk/gpt-computer"
repository = "https://github.com/xeondesk/gpt-computer"
documentation = "https://gpt-computer.readthedocs.io/en/latest/"

[project.scripts]
gpt-computer = "gpt_computer.applications.cli.main:app"
ge = "gpt_computer.applications.cli.main:app"
gptc = "gpt_computer.applications.cli.main:app"
bench = "gpt_computer.benchmark.__main__:app"
gptc_test_application = "tests.caching_main:app"

[dependency-groups]
dev = [
  "pytest>=8.4.2",
  "pytest-cov>=4.1.0",
  "mypy==1.3.0",
  "ruff>=0.0.272",
  "pre-commit==3.3.3",
  "tox>=3.0.0",
  "pytest-asyncio>=1.2.0",
  "pytest-mock>=3.15.1"
]
docs = [
  "autodoc_pydantic>=1.8.0",
  "myst_parser>=0.18.1",
  "nbsphinx>=0.8.9",
  "sphinx>=5.0.0",
  "sphinx-autobuild>=2021.3.14",
  "sphinx_book_theme>=0.3.3",
  "sphinx_rtd_theme>=1.0.0",
  "sphinx-typlog-theme>=0.8.0",
  "toml>=0.10.2",
  "myst-nb>=0.17.1",
  "linkchecker>=10.2.1",
  "sphinx-copybutton>=0.5.1",
  "markdown-include>=0.6.0",
  "sphinx_copybutton>=0.5.2",
]

[build-system]
requires = ["hatchling", "setuptools"]
build-backend = "hatchling.build"

[tool.uv.extra-build-dependencies]
openai-whisper = ["setuptools"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E", "W", "I001"]
extend-ignore = ["E501", "E722"]
task-tags = ["TODO", "FIXME"]

[tool.ruff.lint.isort]
known-first-party = []
known-third-party = []
section-order = [
  "future",
  "standard-library",
  "third-party",
  "first-party",
  "local-folder",
]
combine-as-imports = true
split-on-trailing-comma = false
lines-between-types = 1

[tool.pytest.ini_options]
markers = [
  "requires_key: marks tests as requiring access to a valid OPENAI_API_KEY (deselect with '-m \"not requires_key\"')",
]
